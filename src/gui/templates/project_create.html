{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Create project" %} — Test radar{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-3">
  <div class="bg-white dark:bg-gray-800 rounded shadow p-6 space-y-4">
    <h1 class="text-xl font-semibold text-gray-800 dark:text-gray-100">{% trans "Create project" %}</h1>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_name" class="block text-sm text-gray-700 dark:text-gray-300 mb-1">{% trans "Name" %}</label>
        <input
          type="text"
          name="name"
          id="id_name"
          value="{{ form.name.value|default:'' }}"
          autofocus
          required
          maxlength="255"
          class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 bg-white dark:bg-gray-700 dark:text-gray-100"
        />
        {% if form.name.errors %}
        <p class="text-red-600 dark:text-red-400 text-sm mt-1">{{ form.name.errors.0 }}</p>
        {% endif %}
      </div>

      <button
        type="submit"
        class="w-full bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition cursor-pointer"
      >
        {% trans "Create" %}
      </button>
    </form>
  </div>
</div>
{% endblock %}
