[flake8]
max-line-length = 120
ignore = WPS412, WPS410, E203
exclude =
  build,
  .venv,
  venv,
  __pycache__,
  .mypy_cache,
  .ruff_cache,
  manage.py,
  settings.py,
  */migrations/*,
  models.py,
  pytest_radar/*,
  tests/*
per-file-ignores =
  src/tests/*:
    # Use of assert detected. The enclosed code will be removed when compiling to optimised byte code.
    S101,
    # Found string literal over-use
    WPS202,
    # Found string literal over-use
    WPS432,
    # Found magic number
    WPS432,
    # Found wrong keyword: pass
    WPS420,
    # Found incorrect node inside `class` body
    WPS604,
    # Found outer scope names shadowing
    WPS442,
    # Found comparison with float or complex number
    WPS459,
    # split between test action and assert
    WPS473,
    # Found compare with falsy constant
    WPS520,
    # Found string literal over-use
    WPS226,
    # Found overused expression
    WPS204,
    # Missing parameter(s) in Docstring
    DAR101,
    # Missing "Yields" in Docstring: - yield
    DAR301,
    # Not use rst format
    RST
  src/*urls.py:
  # Found too many imported names from a module
    WPS235

[mypy]
disallow_untyped_defs = True
check_untyped_defs = True
ignore_missing_imports = True
exclude = manage.py|settings.py|migrations/
plugins = mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = "server.settings"
