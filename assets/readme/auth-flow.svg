<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="600" viewBox="0 0 1200 600"
     role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Agent authentication flow</title>
  <desc id="flow-desc">Five-stage flow: token creation, request, middleware passthrough, DRF token authentication, and view access.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/>
    </marker>
  </defs>

  <rect width="1200" height="600" rx="24" fill="#0d1117"/>

  <text x="60" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="26" font-weight="700" fill="#e6edf3">
    Agent Authentication Flow
  </text>
  <text x="60" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="16" fill="#6e7681">
    Token-based auth — separate from web UI session auth
  </text>

  <line x1="600" y1="168" x2="600" y2="192" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="264" x2="600" y2="288" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="360" x2="600" y2="384" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="456" x2="600" y2="480" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="100" width="1080" height="68" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="92" cy="134" r="16" fill="#22c55e"/>
    <text x="92" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="700" fill="#0d1117" text-anchor="middle">1</text>
    <text x="122" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="17" font-weight="600" fill="#e6edf3">Token creation</text>
    <text x="122" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" fill="#9198a1">Agent created via admin or web form, linked to Project + owner</text>
    <text x="680" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#7d8590">create_token_for_agent()  →  ci_xxx / dev_xxx  ·  bcrypt hash stored</text>
  </g>

  <g>
    <rect x="60" y="196" width="1080" height="68" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="92" cy="230" r="16" fill="#22c55e"/>
    <text x="92" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="700" fill="#0d1117" text-anchor="middle">2</text>
    <text x="122" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="17" font-weight="600" fill="#e6edf3">Request</text>
    <text x="122" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" fill="#9198a1">Agent sends test results with token header</text>
    <text x="680" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#7d8590">Authorization: Token ci_&lt;raw_token&gt;</text>
  </g>

  <g>
    <rect x="60" y="292" width="1080" height="68" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="92" cy="326" r="16" fill="#22c55e"/>
    <text x="92" y="331" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="700" fill="#0d1117" text-anchor="middle">3</text>
    <text x="122" y="321" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="17" font-weight="600" fill="#e6edf3">Middleware</text>
    <text x="122" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" fill="#9198a1">AuthRequiredMiddleware lets all /api/ paths pass through</text>
    <text x="680" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#7d8590">/api/  →  bypass session auth  ·  DRF handles 401</text>
  </g>

  <g>
    <rect x="60" y="388" width="1080" height="68" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="92" cy="422" r="16" fill="#22c55e"/>
    <text x="92" y="427" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="700" fill="#0d1117" text-anchor="middle">4</text>
    <text x="122" y="417" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="17" font-weight="600" fill="#e6edf3">DRF authentication</text>
    <text x="122" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" fill="#9198a1">AgentTokenAuthentication verifies bcrypt, updates last_used_at</text>
    <text x="680" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#7d8590">verify_token()  →  (owner, ApiToken)</text>
  </g>

  <g>
    <rect x="60" y="484" width="1080" height="68" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="92" cy="518" r="16" fill="#22c55e"/>
    <text x="92" y="523" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="700" fill="#0d1117" text-anchor="middle">5</text>
    <text x="122" y="513" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="17" font-weight="600" fill="#e6edf3">View</text>
    <text x="122" y="536" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" fill="#9198a1">IsAuthenticated check passes, view processes the request</text>
    <text x="680" y="524" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#7d8590">request.user = owner  ·  request.auth = ApiToken</text>
  </g>
</svg>
