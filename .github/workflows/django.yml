name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: 3.12
    - name: Setup uv
      uses: astral-sh/setup-uv@v6.1.0
      with:
        python-version: 3.12
        activate-environment: true
    - name: Install Dependencies
      run: uv sync --no-default-groups

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: 3.12
    - name: Setup uv
      uses: astral-sh/setup-uv@v6.1.0
      with:
        python-version: 3.12
        activate-environment: true
    - name: Install Dependencies
      run: uv sync --no-default-groups
    - name: Lint with ruff
      run: uv run ruff check src
    - name: Lint with flake8
      run: uv run flake8 src
    - name: Lint with mypy
      run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: 3.12
    - name: Setup uv
      uses: astral-sh/setup-uv@v6.1.0
      with:
        python-version: 3.12
        activate-environment: true
    - name: Install gettext
      run: sudo apt-get update && sudo apt-get install -y gettext
    - name: Install Dependencies
      run: uv sync --all-groups
    - name: Check translations are up to date
      run: |
        uv run django-admin makemessages -l ru -l en --no-location --no-wrap
        git diff --exit-code --ignore-matching-lines='^"POT-Creation-Date' -- src/locale/
      working-directory: src
    - name: Compile translations
      run: uv run python src/manage.py compilemessages
    - name: Test
      run: uv run pytest src/tests -vv

  deltaver:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: 3.12
    - name: Setup uv
      uses: astral-sh/setup-uv@v6.1.0
      with:
        python-version: 3.12
        activate-environment: true
    - name: Install Dependencies
      run: uv export > requirements.txt
    - name: Run deltaver
      run: uv run deltaver requirements.txt --format pip-freeze
