name: Deploy

on:
  # push:
  #   branches: [ "master" ]
  push:
    branches: [ "*" ]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: 3.14
          activate-environment: true
      - name: Install Dependencies
        run: uv sync --no-default-groups
      - name: Lint with ruff
        run: uv run ruff check src

  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Get tag name
        id: tag_name
        run: echo "::set-output name=TAG_NAME::$(echo ${GITHUB_SHA})"
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: blablatdinov/test-radar:${{ steps.tag_name.outputs.TAG_NAME }}

  # apply-nginx-conf:
  #   needs: build-and-push
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout Repository
  #       uses: actions/checkout@v4
  #     - name: Install SSH Key
  #       uses: shimataro/ssh-key-action@v2
  #       with:
  #         key: ${{ secrets.SSH_KEY }}
  #         known_hosts: '87.249.49.217 ssh-rsa '
  #     - name: Apply nginx config
  #       run: |
  #         scp deploy/test_radar_nginx.conf www@87.249.49.217:/etc/nginx/sites-enabled/
  #         ssh www@87.249.49.217 'sudo nginx -t && sudo service nginx reload'

  run-migrations:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: '87.249.49.217 ssh-rsa '
      - name: Setup SSH
        run: |
          ssh-keyscan -H 87.249.49.217 >> ~/.ssh/known_hosts
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: 3.14
          activate-environment: true
      - name: Install Dependencies
        run: uv sync --no-default-groups
      - name: Run migrations
        run: DATABASE_URL=${{ secrets.PROD_DATABASE_URL }} uv run python src/manage.py migrate

  deploy-blue-green:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: '87.249.49.217 ssh-rsa '
      - name: Setup SSH
        run: |
          ssh-keyscan -H 87.249.49.217 >> ~/.ssh/known_hosts
      - name: Get tag name
        id: tag_name
        run: echo "tag_name=${GITHUB_SHA}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v7
      - name: Determine current active environment
        id: active_color
        run: |
          # Проверяем какой контейнер сейчас активен через Nginx
          CURRENT=$(ssh www@87.249.49.217 "grep 'server 127.0.0.1:' /etc/nginx/sites-enabled/test_radar_nginx.conf | grep -o '801[23]' || echo '8012'")
          if [ "$CURRENT" == "8012" ]; then
            echo "CURRENT_ACTIVE=blue" >> $GITHUB_OUTPUT
            echo "NEW_ACTIVE=green" >> $GITHUB_OUTPUT
            echo "CURRENT_PORT=8012" >> $GITHUB_OUTPUT
            echo "NEW_PORT=8013" >> $GITHUB_OUTPUT
          else
            echo "CURRENT_ACTIVE=green" >> $GITHUB_OUTPUT
            echo "NEW_ACTIVE=blue" >> $GITHUB_OUTPUT
            echo "CURRENT_PORT=8013" >> $GITHUB_OUTPUT
            echo "NEW_PORT=8012" >> $GITHUB_OUTPUT
          fi
      - name: Deploy to inactive environment
        run: |
          ssh www@87.249.49.217 '
            cd /home/www/code/test-radar
            NEW_COLOR="${{ steps.active_color.outputs.NEW_ACTIVE }}"
            NEW_PORT="${{ steps.active_color.outputs.NEW_PORT }}"
            echo "Deploying to $NEW_COLOR environment on port $NEW_PORT"
            docker stop test-radar-http-$NEW_COLOR || true
            docker rm test-radar-http-$NEW_COLOR || true
            TAG_NAME=${{ steps.tag_name.outputs.tag_name }} \
            docker compose -f deploy/docker-compose.prod.yml up -d test-radar-http-$NEW_COLOR
          '
      
      - name: Health check new environment
        run: |
          NEW_PORT="${{ steps.active_color.outputs.NEW_PORT }}"
          for i in {1..15}; do
            if curl -s -f -o /dev/null "http://87.249.49.217:$NEW_PORT/health/"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for health check... ($i/15)"
            sleep 5
          done
          echo "Health check failed"
          exit 1
      
      - name: Switch traffic to new environment
        run: |
          NEW_PORT="${{ steps.active_color.outputs.NEW_PORT }}"
          NEW_COLOR="${{ steps.active_color.outputs.NEW_ACTIVE }}"
          ssh www@87.249.49.217 '
            sudo sed -i "s/server 127.0.0.1:[0-9]\\{4\\}/server 127.0.0.1:$NEW_PORT/g" /etc/nginx/sites-enabled/test_radar_nginx.conf
            sudo nginx -t || exit 1
            sudo systemctl reload nginx
            echo "Switched traffic to $NEW_COLOR environment on port $NEW_PORT"
          '
      - name: Stop old environment
        run: |
          OLD_COLOR="${{ steps.active_color.outputs.CURRENT_ACTIVE }}"
          ssh www@87.249.49.217 '
            cd /home/www/code/test-radar
            echo "Stopping old $OLD_COLOR environment"
            # Останавливаем старый контейнер
            docker stop test-radar-http-$OLD_COLOR || true
            # Опционально: удаляем старый контейнер
            # docker rm test-radar-http-$OLD_COLOR || true
          '
      - name: Remove old images
        run: |
          ssh www@87.249.49.217 '
            # Удаляем старые образы, сохраняя последние 2 (blue и green)
            docker images blablatdinov/test-radar --format "{{.ID}} {{.CreatedAt}}" | sort -k2 | head -n -2 | awk "{print \$1}" | xargs -r docker rmi -f || true
            echo "Cleaned up old images"
          '
      - name: Update deployment status
        run: |
          echo "Deployment successful!"
          echo "Active environment: ${{ steps.active_color.outputs.NEW_ACTIVE }}"
          echo "Active port: ${{ steps.active_color.outputs.NEW_PORT }}"

  rollback:
    needs: deploy-blue-green
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
      - name: Setup SSH
        run: |
          ssh-keyscan -H 87.249.49.217 >> ~/.ssh/known_hosts
      - name: Rollback to previous environment
        run: |
          OLD_PORT="${{ steps.active_color.outputs.CURRENT_PORT }}"
          OLD_COLOR="${{ steps.active_color.outputs.CURRENT_ACTIVE }}"
          
          ssh www@87.249.49.217 '
            # Возвращаем предыдущую конфигурацию Nginx
            sudo sed -i "s/server 127.0.0.1:[0-9]\\{4\\}/server 127.0.0.1:$OLD_PORT/g" /etc/nginx/sites-available/test-radar
            sudo nginx -t && sudo systemctl reload nginx
            
            echo "Rolled back to $OLD_COLOR environment on port $OLD_PORT"
          '
