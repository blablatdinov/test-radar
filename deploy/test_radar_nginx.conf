server {
  server_name test-radar.ilaletdinov.ru;

  set $backend "127.0.0.1:8012";
    
  location / {
    proxy_pass http://$backend;
    proxy_set_header Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  listen 80;
  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/test-radar.ilaletdinov.ru/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/test-radar.ilaletdinov.ru/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
  if ($host = test-radar.ilaletdinov.ru) {
      return 301 https://$host$request_uri;
  } # managed by Certbot
  server_name test-radar.ilaletdinov.ru;
  listen 80;
  return 404; # managed by Certbot
}
