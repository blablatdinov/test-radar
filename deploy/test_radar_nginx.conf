upstream test-radar-blue {
    server 127.0.0.1:8012;
}

upstream test-radar-green {
    server 127.0.0.1:8013;
}

# Активный upstream - меняем симлинк или используем переменную
upstream test-radar-active {
    # По умолчанию blue
    server 127.0.0.1:8012;
}

server {
  server_name test-radar.ilaletdinov.ru;

  location / {
    proxy_pass http://127.0.0.1:8012;
    proxy_set_header Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/test-radar.ilaletdinov.ru/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/test-radar.ilaletdinov.ru/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
  if ($host = test-radar.ilaletdinov.ru) {
      return 301 https://$host$request_uri;
  } # managed by Certbot
  server_name test-radar.ilaletdinov.ru;
  listen 80;
  return 404; # managed by Certbot
}
